<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Dataset Request Desk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <h1>Dataset Request Desk</h1>
  <p>Sign in with your operations account.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required value="{{ email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <p><button class="btn btn-primary" type="submit">Sign in</button></p>
  </form>
</div>
</body>
</html>
