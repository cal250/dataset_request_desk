{% extends "base.html" %}
{% block title %}New request — Dataset Request Desk{% endblock %}
{% block header %}New request{% endblock %}
{% block content %}
<form method="post" action="/requests/form">
  <label for="task_name">Task name</label>
  <input id="task_name" name="task_name" required maxlength="200" value="{{ form.task_name or '' }}">
  <label for="episodes_requested">Episodes requested</label>
  <input id="episodes_requested" name="episodes_requested" type="number" min="1" max="100000" required value="{{ form.episodes_requested or '' }}">
  <label for="deadline">Deadline</label>
  <input id="deadline" name="deadline" type="date" required value="{{ form.deadline or '' }}">
  <label for="notes">Notes (optional)</label>
  <textarea id="notes" name="notes" rows="3">{{ form.notes or '' }}</textarea>
  <p><button class="btn btn-primary" type="submit">Create request</button></p>
</form>
{% endblock %}
